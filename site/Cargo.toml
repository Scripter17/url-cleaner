[package]
name         = "url-cleaner-site"
version      = "0.12.0-beta"
edition      = "2024"
description  = "URL Cleaner's official HTTP/HTTPS/WS/WSS server frontend."
repository   = "https://github.com/Scripter17/url-cleaner"
keywords     = ["url", "url-tracking", "privacy", "url-cleaner"]
categories   = ["web-programming::http-server"]
license      = "AGPL-3.0-or-later"
readme       = "README.md"
rust-version = "1.96.1"

[dependencies]
# URL Cleaner.
better-url         = { version = "0.12.0-beta", path = "../better-url"                           }
url-cleaner-engine = { version = "0.12.0-beta", path = "../engine"    , default-features = false }

# Axum.
axum         = { version = "0.8.9", features = ["http2", "ws"] }
axum-server  = { version = "0.8.0", features = ["tls-rustls-no-provider"] }

# Async.
tokio        = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
futures-util = { version = "0.3.34", features = ["io"] }
tokio-stream = "0.1.19"
async-stream = "0.3.6"

# Other.
clap         = { version = "4.6.7", features = ["derive"] }
serde        = { version = "1.0.229", features = ["derive"] }
const-str    = { version = "1.1.0", features = ["proc"] }
bytes        = "1.12.1"
serde_json   = "1.0.151"
thiserror    = "2.0.21"
http         = "1.5.0"

[features]
default = ["bundled-cleaner"]

bundled-cleaner = [
  "url-cleaner-engine/bundled-cleaner",
  "http",
  "cache"
]

http  = ["url-cleaner-engine/http" ]
cache = ["url-cleaner-engine/cache"]

[lints]
workspace = true
