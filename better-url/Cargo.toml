[package]
name         = "better-url"
version      = "0.12.0-beta"
edition      = "2024"
description  = "A better URL crate."
repository   = "https://github.com/Scripter17/url-cleaner"
keywords     = ["url"]
categories   = []
license      = "AGPL-3.0-or-later"
readme       = "README.md"
rust-version = "1.96.1"

[dependencies]
serde          = { version = "1.0.229", optional = true, features = ["derive"] }
psl            = { version = "2.1.245", optional = true, default-features = false }
icu_normalizer = { version = "2.4.0"  , default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.4.0"  , default-features = false, features = ["compiled_data"] }
libc           = { version = "0.2.191", default-features = false }
thiserror      = "2.0.21"
smallvec       = "1.16.4"
memchr         = "2.8.3"

[dev-dependencies]
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
serde = ["dep:serde"]
psl   = ["dep:psl"  ]

[lints]
workspace = true
