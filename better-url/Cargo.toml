[package]
name         = "better-url"
version      = "0.12.0-beta"
edition      = "2024"
description  = "A better URL crate."
repository   = "https://github.com/Scripter17/url-cleaner"
keywords     = ["url"]
categories   = []
license      = "AGPL-3.0-or-later"
readme       = "README.md"
rust-version = "1.96.1"

[dependencies]
# Serde stuff.
serde = { version = "1.0.229", optional = true, features = ["derive"] }

# Other.
icu_normalizer = { version = "2.2.0", default-features = false, features = ["compiled_data"] }
icu_properties = "2.2.0"
psl            = "2.1.223"
thiserror      = "2.0.19"
include_data   = "1.0.1"
libc           = "0.2.189"

[dev-dependencies]
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
serde = ["dep:serde"]

[lints]
workspace = true
