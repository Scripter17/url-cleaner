[package]
name         = "url-cleaner-site-types"
version      = "0.12.0-beta"
edition      = "2024"
description  = "Types for URL Cleaner Site."
repository   = "https://github.com/Scripter17/url-cleaner"
keywords     = ["url-cleaner"]
categories   = []
license      = "AGPL-3.0-or-later"
readme       = "README.md"
rust-version = "1.96.1"

[dependencies]
# URL Cleaner.
better-url         = { version = "0.12.0-beta", path = "../better-url"                           }
url-cleaner-engine = { version = "0.12.0-beta", path = "../engine"    , default-features = false }

# Other.
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
axum-core  = { version = "0.5.6"  , optional = true }
http       = { version = "1.4.2"  , optional = true }
thiserror  = "2.0.19"

[features]
axum = ["dep:axum-core", "dep:http", "dep:serde_json"]

[lints]
workspace = true
