name: Site

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_dev_DEBUG: 0

jobs:
  site:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup
      run: |
        set -euo pipefail
        cargo build --bin url-cleaner-site --bin url-cleaner-site-client
        cp target/debug/url-cleaner-site urlcs
        cp target/debug/url-cleaner-site-client urlcsc
        ./urlcs keygen
        sudo cp urlcs-tls-stuff/urlcs-ca.crt /usr/local/share/ca-certificates/
        sudo update-ca-certificates

    - name: 'Output'
      run: |
        for scheme in http ws https wss; do
          case "$scheme" in
            http  | ws)  ./urlcs run & ;;
            https | wss) ./urlcs run --key urlcs-tls-stuff/urlcs.key --cert urlcs-tls-stuff/urlcs.crt & ;;
          esac

          sleep 1;

          for num in 0 1 10 100 1000 10000; do
            for n in $'\n' $'\r\n' $'\n\n' $'\n\r\n' $'\r\n\n' $'\r\n\r\n'; do
              diff <(seq -s "$n" -t "$n" -f "https://stdin/%0.0f" $num | ./urlcsc clean $scheme://localhost:9149) <(seq -f "https://stdin/%0.0f" $num)
            done
          done

          kill %%
        done

    - name: 'Profiles'
      run: |
        PROFILES='
        {
          "base": {
            "vars": {
              "client_type": "desktop"
            }
          },
          "named": {
            "youtube unshort": {
              "flags": ["youtube_unshort"]
            }
          }
        }'
        PARAMS_DIFF1='{"unvars": ["client_type"]}'
        PARAMS_DIFF2='{"vars": {"client_type": "mobile"}}'


        for scheme in http ws https wss; do
          case "$scheme" in
            http  | ws)  ./urlcs run --profiles <(echo "$PROFILES") & ;;
            https | wss) ./urlcs run --profiles <(echo "$PROFILES") --key urlcs-tls-stuff/urlcs.key --cert urlcs-tls-stuff/urlcs.crt & ;;
          esac

          sleep 1;

          diff -y <(
            echo 'https://m.youtube.com/shorts/abc' | ./urlcsc clean "$scheme://127.0.0.1:9149/clean"
            echo 'https://m.youtube.com/shorts/abc' | ./urlcsc clean "$scheme://127.0.0.1:9149/clean"                             --params-diff "$PARAMS_DIFF1"
            echo 'https://m.youtube.com/shorts/abc' | ./urlcsc clean "$scheme://127.0.0.1:9149/clean" --profile "youtube unshort"
            echo 'https://m.youtube.com/shorts/abc' | ./urlcsc clean "$scheme://127.0.0.1:9149/clean" --profile "youtube unshort" --params-diff "$PARAMS_DIFF1"

            echo 'https://youtube.com/shorts/abc'   | ./urlcsc clean "$scheme://127.0.0.1:9149/clean"
            echo 'https://youtube.com/shorts/abc'   | ./urlcsc clean "$scheme://127.0.0.1:9149/clean"                             --params-diff "$PARAMS_DIFF2"
            echo 'https://youtube.com/shorts/abc'   | ./urlcsc clean "$scheme://127.0.0.1:9149/clean" --profile "youtube unshort"
            echo 'https://youtube.com/shorts/abc'   | ./urlcsc clean "$scheme://127.0.0.1:9149/clean" --profile "youtube unshort" --params-diff "$PARAMS_DIFF2"
          ) <(
            echo  'https://www.youtube.com/shorts/abc'
            echo    'https://m.youtube.com/shorts/abc'
            echo 'https://www.youtube.com/watch?v=abc'
            echo   'https://m.youtube.com/watch?v=abc'

            echo  'https://www.youtube.com/shorts/abc'
            echo    'https://m.youtube.com/shorts/abc'
            echo 'https://www.youtube.com/watch?v=abc'
            echo   'https://m.youtube.com/watch?v=abc'
          )

          ! echo | ./urlcsc clean "$scheme://127.0.0.1:9149/clean" --profile "Unknown" 2> /dev/null

          kill %%
        done

    - name: 'Passwords'
      run: |
        SECRETS='{"passwords":["test"]}'

        for scheme in http ws https wss; do
          case "$scheme" in
            http  | ws)  ./urlcs run --secrets <(echo "$SECRETS") & ;;
            https | wss) ./urlcs run --secrets <(echo "$SECRETS") --key urlcs-tls-stuff/urlcs.key --cert urlcs-tls-stuff/urlcs.crt & ;;
          esac

          sleep 1;

          ! echo | ./urlcsc clean "$scheme://127.0.0.1:9149"                    2> /dev/null
            echo | ./urlcsc clean "$scheme://127.0.0.1:9149" --password test
          ! echo | ./urlcsc clean "$scheme://127.0.0.1:9149" --password invalid 2> /dev/null

          kill %%
        done

    - name: 'CLIent gets'
      run: |
        for scheme in http https; do
          case "$scheme" in
            http  | ws)  ./urlcs run & ;;
            https | wss) ./urlcs run --key urlcs-tls-stuff/urlcs.key --cert urlcs-tls-stuff/urlcs.crt & ;;
          esac

          sleep 1;

          for thing in index info cleaner profiles userscript; do
            ./urlcsc get "$thing" "$scheme://127.0.0.1:9149"
          done

          kill %%
        done

    - name: 'CLIent clean options'
      run: |
        SECRETS='{"passwords":["test"]}'
        PROFILES='
        {
          "base": {
            "vars": {
              "client_type": "desktop"
            }
          },
          "named": {
            "youtube unshort": {
              "flags": ["youtube_unshort"]
            }
          }
        }'

        for scheme in http ws https wss; do
          case "$scheme" in
            http  | ws)  ./urlcs run --secrets <(echo "$SECRETS") --profiles <(echo "$PROFILES") & ;;
            https | wss) ./urlcs run --secrets <(echo "$SECRETS") --profiles <(echo "$PROFILES") --key urlcs-tls-stuff/urlcs.key --cert urlcs-tls-stuff/urlcs.crt & ;;
          esac

          sleep 1;

          echo | ./urlcsc clean "$scheme://127.0.0.1:9149" --password test --profile 'youtube unshort' --params-diff '{"flags":[]}' --context '{"flags":[]}' -ueTHRWC

          kill %%
        done
