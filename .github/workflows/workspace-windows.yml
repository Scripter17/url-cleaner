name: Workspace Windows

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_dev_DEBUG: 0

jobs:
  test_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: taiki-e/install-action@cargo-hack
    - name: Test
      run: cargo hack test --feature-powerset --clean-per-run

  doc_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: taiki-e/install-action@cargo-hack
    - name: Doc
      run: cargo hack doc --feature-powerset --no-deps --clean-per-run --document-private-items

  clippy_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: taiki-e/install-action@cargo-hack
    - name: Clippy
      run: cargo hack clippy --feature-powerset --clean-per-run -- -D warnings
