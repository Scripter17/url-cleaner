name: Build

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: ${{ !github.event.act }}

    strategy:
      matrix:
        oses: [
            {name: ubuntu-latest , extension: ""},
            {name: windows-latest, extension: ".exe"},
            {name: macos-latest  , extension: ""}
          ]

    runs-on: ${{ matrix.oses.name }}

    steps:
    - uses: actions/checkout@v7

    - name: Build
      run: cargo build -r --bin url-cleaner --bin url-cleaner-site --bin url-cleaner-site-client --bin url-cleaner-discord

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ runner.os }}
        if-no-files-found: error
        path: |
          target/release/url-cleaner${{ matrix.oses.extension }}
          target/release/url-cleaner-site${{ matrix.oses.extension }}
          target/release/url-cleaner-site-client${{ matrix.oses.extension }}
          target/release/url-cleaner-discord${{ matrix.oses.extension }}
          LICENSE.txt
          engine/src/cleaner/bundled-cleaner.json
          site/src/userscript.js
          *.md
          Cargo.toml
          Cargo.lock
          macros/
          better-url/
          better-url-bench/
          !better-url-bench/data/top100.txt
          !better-url-bench/data/reddit.txt
          engine/
          cli/
          site/
          site-client/
          discord/
