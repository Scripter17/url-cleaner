name: Build

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: ${{ !github.event.act }}

    strategy:
      matrix:
        oses: [
            {name: linux  , runner: ubuntu-latest , extension: ""    },
            {name: windows, runner: windows-latest, extension: ".exe"},
            {name: macos  , runner: macos-latest  , extension: ""    }
          ]

    runs-on: ${{ matrix.oses.runner }}

    steps:
    - uses: actions/checkout@v7

    - name: Build
      run: |
        cargo build -r --bin url-cleaner --bin url-cleaner-site --bin url-cleaner-site-client --bin url-cleaner-discord
        cp target/release/url-cleaner${{ matrix.oses.extension }}             ./
        cp target/release/url-cleaner-site${{ matrix.oses.extension }}        ./
        cp target/release/url-cleaner-site-client${{ matrix.oses.extension }} ./
        cp target/release/url-cleaner-discord${{ matrix.oses.extension }}     ./

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: url-cleaner-${{ matrix.oses.name }}
        if-no-files-found: error
        path: |
          url-cleaner*
          LICENSE.txt
          engine/src/cleaner/bundled-cleaner.json
          site/src/userscript.js
          *.md
          Cargo.toml
          Cargo.lock
          macros/
          better-url/
          better-url-bench/
          !better-url-bench/data/top100.txt
          !better-url-bench/data/reddit.txt
          engine/
          cli/
          site/
          site-client/
          discord/
