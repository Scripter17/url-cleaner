[package]
name         = "url-cleaner-site-client"
version      = "0.12.0-beta"
edition      = "2024"
description  = "A CLI client for URL Cleaner Site."
repository   = "https://github.com/Scripter17/url-cleaner"
keywords     = ["url-cleaner"]
categories   = []
license      = "AGPL-3.0-or-later"
readme       = "README.md"
rust-version = "1.96.1"

[dependencies]
# URL Cleaner
better-url = { version = "0.12.0-beta", path = "../better-url", features = ["serde", "psl"] }

# Websockets
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots", "url"] }

# HTTP
hyper-rustls   = { version = "0.27.10", features = ["http2"] }
hyper          = "1.12.0"
hyper-util     = "0.1.21"
http-body-util = "0.1.5"

# Other
tokio        = { version = "1.54.1", features = ["io-std", "macros", "rt-multi-thread"] }
clap         = { version = "4.6.7" , features = ["derive"] }
async-stream = "0.3.6"
futures-util = "0.3.34"
bytes        = "1.12.1"
serde_json   = "1.0.154"

[lints]
workspace = true
