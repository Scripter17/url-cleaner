[package]
name    = "urlc-tool"
version = "0.12.0-beta"
edition = "2024"
publish = false

[dependencies]
# URL Cleaner.
better-url         = { version = "0.12.0-beta", path = "../better-url" }
url-cleaner-engine = { version = "0.12.0-beta", path = "../engine"     }

# Other.
tokio      = { version = "1.53.1" , features = ["rt-multi-thread" ] }
clap       = { version = "4.6.6"  , features = ["derive", "string"] }
reqwest    = { version = "0.12.28", features = ["blocking"        ] }
serde      = { version = "1.0.229", features = ["derive"          ] }
serde_json = "1.0.151"
libc       = "0.2.189"
regex      = "1.13.1"
indexmap   = "2.14.2"

[lints]
workspace = true
