[package]
name         = "urlc-tool"
version      = "0.12.0-beta"
edition      = "2024"
rust-version = "1.96.1"
publish      = false

[dependencies]
# URL Cleaner
better-url         = { version = "0.12.0-beta", path = "../better-url", features = ["serde", "psl"] }
url-cleaner-engine = { version = "0.12.0-beta", path = "../engine"                                  }

# Other
tokio      = { version = "1.54.1" , features = ["rt-multi-thread" ] }
clap       = { version = "4.6.7"  , features = ["derive", "string"] }
reqwest    = { version = "0.13.5" , features = ["blocking"        ] }
serde      = { version = "1.0.229", features = ["derive"          ] }
serde_json = "1.0.154"
libc       = "0.2.191"
regex      = "1.13.1"
indexmap   = "2.14.2"

[lints]
workspace = true
